name: LD ICT Help release

# Builds LD ICT Help for Windows, macOS and Linux with RustDesk's own build workflow and puts the files on a GitHub
# release of this repository. Start it by pushing a tag like ldict-1.5.3-1 (RustDesk's version, then our build
# number), or run it by hand (Actions, "Run workflow") with that tag: it then creates the tag on the chosen branch. The website (LD-ICT/ld-ict-website, .github/workflows/hulp-release.yml) copies the release to
# kluis.ldict.nl/hulp/, behind the links at www.ldict.nl/api/hulp/download/<platform>.
#
# This repository has no secrets: no code signing yet (PLAN-HULP-OP-AFSTAND.md, decision B4), and the copy to
# LD ICT's storage happens in the website's private repository.

on:
  push:
    tags:
      - "ldict-[0-9]+.[0-9]+.[0-9]+-[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, like ldict-1.5.3-1"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^ldict-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::The tag must look like ldict-1.5.3-1."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick the next build number."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build number matches src/ldict.rs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BUILD=$(sed -n 's/^pub const BUILD: u32 = \([0-9]*\);/\1/p' src/ldict.rs)
          if [ "${TAG##*-}" != "$BUILD" ]; then
            echo "::error::Tag $TAG ends in ${TAG##*-}, but BUILD in src/ldict.rs is $BUILD. Raise BUILD first."
            exit 1
          fi
      - name: Token key is set
        run: |
          KEY=$(tr -d '[:space:]' < ldict/token.pub)
          if [ "$(printf '%s' "$KEY" | base64 -d 2>/dev/null | wc -c)" != "32" ]; then
            echo "::error::ldict/token.pub must hold LD ICT's public key for connection tokens (base64, 32 bytes). Copy it from /admin/servers/hulp."
            exit 1
          fi
      - name: Server key is set
        run: |
          KEY=$(tr -d '[:space:]' < ldict/key.pub)
          if [ "$(printf '%s' "$KEY" | base64 -d 2>/dev/null | wc -c)" != "32" ]; then
            echo "::error::ldict/key.pub must hold the support server's public key (base64, 32 bytes). Copy it from /admin/servers/hulp."
            exit 1
          fi
      - name: Create the tag (when started by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  build:
    needs: check
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ needs.check.outputs.tag }}
      publish-update-metadata: false
